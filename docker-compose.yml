version: "3.8"

services:
  excalidraw-storage-backend:
    build: 
      context: .
      target: development
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      STORAGE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-}
      AI_LLM_URL: ${AI_LLM_URL:-}
      AI_LLM_TOKEN: ${AI_LLM_TOKEN:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_VISION_MODEL: ${AI_LLM_VISION_MODEL:-}
      AI_LLM_RPM: ${AI_LLM_RPM:-}
      AI_LLM_TPM: ${AI_LLM_TPM:-}
      AI_LLM_TPD: ${AI_LLM_TPD:-}
      AI_LLM_MAX_OUTPUT_TOKENS: ${AI_LLM_MAX_OUTPUT_TOKENS:-}
      AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/home/node/app
  postgres:
    image: postgres:15-alpine
    # Pass config parameters to the postgres server.
    # Find more information below when you need to generate the ssl-relevant file your self
    # command: -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-excalidraw-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    # ports:
    #   - "5432:5432"
volumes:
  postgres_data: